name: Sync upstream (merge)

on:
  schedule:
    - cron: '0 3 * * 1'        # 03:00 UTC every Monday
  workflow_dispatch:

permissions:
  contents: write          # push commits
  pull-requests: read      # (not used, but keeps Actions happy)

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Add upstream
        run: |
          git remote add upstream https://github.com/mostlygeek/llama-swap.git
          git fetch upstream

      - name: Merge upstream
        run: |
          # Fast-forward only: succeeds if your fork is simply behind
          if git merge --ff-only upstream/main; then
              git push origin main
              echo "✅ Fast-forward merge completed."
          else
              echo "::error::Conflict detected – please resolve locally."
              echo "::error::Run:  git fetch upstream && git merge upstream/main"
              exit 1   # fail the job so you get a notification
          fi
